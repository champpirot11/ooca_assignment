<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F2A33">
<title>ooca · บทเกริ่น</title>
</head>
<body>
<div class="screen" id="screen">
  <div class="stack" id="stack"></div>

  <header class="topbar">
    <button class="back" id="back" aria-label="ย้อนกลับ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="skip" id="skip">ข้ามบทเกริ่น</button>
  </header>
  <button class="sound" id="sound" aria-pressed="true" aria-label="ปิดเสียง"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path class="w" d="M15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <div class="progress" id="progress" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"><i></i><i></i><i></i><i></i><i></i></div>

  <div class="copies" id="copies" aria-live="polite"></div>

  <div class="hint" id="hint">แตะเพื่อไปต่อ</div>
  <button class="cta" id="cta">เข้าไปในร้าน</button>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
